name: Niko Live Commander - sécurité du conducteur et mobile
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and backup validation
        run: |
          node --check backup.js
          node --check sw.js
          node --test tests/backup.test.cjs
      - name: Chromium conductor restore and 390px mobile smoke
        run: node tests/browser-smoke.cjs
